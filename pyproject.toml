[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidrive"
version = "1.0.0"
description = "Omni-Purpose Autonomous Driving AI Brain (Military · Trucks · RobotTaxis)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "OMNIDRIVE Team" }]

dependencies = [
    # Deep Learning Core
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "einops>=0.7.0",
    "timm>=0.9.16",

    # JEPA / Vision Transformers
    "transformers>=4.41.0",
    "accelerate>=0.30.0",
    "huggingface-hub>=0.23.0",

    # Configuration Management
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",

    # Sensor Processing
    "opencv-python>=4.9.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "open3d>=0.18.0",
    "pyproj>=3.6.0",

    # ROS 2 (installed separately via apt, not pip)
    # "rclpy" -- installed by ROS 2 Humble

    # CAN Bus
    "python-can>=4.3.1",
    "cantools>=39.4.0",

    # Data & Storage
    "h5py>=3.11.0",
    "pyarrow>=16.0.0",
    "datasets>=2.19.0",
    "dvc>=3.50.0",

    # Training & Experiment Tracking
    "wandb>=0.17.0",
    "lightning>=2.2.0",
    "tensorboard>=2.16.0",

    # Simulation
    "gymnasium>=0.29.1",
    "dm-tree>=0.1.8",

    # Utilities
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "pydantic>=2.7.0",
    "psutil>=5.9.0",
    "gputil>=1.4.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
training = [
    "deepspeed>=0.14.0",
    "flash-attn>=2.5.0",
    "triton>=2.3.0",
    "bitsandbytes>=0.43.0",
]
simulation = [
    "carla>=0.9.15",
]
military = [
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "training*", "simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
