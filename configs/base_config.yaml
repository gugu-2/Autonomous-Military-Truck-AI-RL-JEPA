# Project metadata
project:
  name: omnidrive
  version: '1.0.0'
  vehicle_mode: robotaxi  # overridden per deployment

# Compute hardware
hardware:
  device: cuda
  num_gpus: 1
  mixed_precision: bf16
  compile_model: true
  tensorrt_export: false
  gpu_memory_limit_gb: 8.0

# Sensor configuration  
sensors:
  cameras:
    num_cameras: 4
    resolution: [224, 224]
    fps: 30
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
  lidar:
    enabled: true
    bev_resolution: 0.1  # metres/pixel
    bev_range_m: 100.0   # +/- 50m each side
    bev_height_bins: 32
  radar:
    enabled: true
    max_range_m: 300.0
  gps_imu:
    enabled: true
    ekf_process_noise: 0.01
  thermal:
    enabled: false  # overridden in military config

# JEPA World Model
jepa:
  encoder:
    model: vit_base_patch16  # 'vit_small_patch16', 'vit_base_patch16', 'vit_large_patch16'
    patch_size: 16
    embed_dim: 512
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
  temporal:
    context_frames: 5   # t-4 to t
    prediction_horizon: 10  # predict t+1 to t+10 (3 seconds)
    fps: 3.33  # prediction rate in Hz
  predictor:
    depth: 6
    num_heads: 8
    embed_dim: 512
  ema:
    momentum: 0.996
  hazard:
    warn_threshold: 0.45
    veto_threshold: 0.70
    emergency_brake_threshold: 0.85

# RL Controller (DreamerV3)
rl:
  dreamer:
    rssm_deter_dim: 512
    rssm_stoch_dim: 32
    rssm_num_classes: 32
    actor_layers: [512, 512, 512]
    critic_layers: [512, 512, 512]
    imagination_horizon: 15
    replay_buffer_size: 1000000
    batch_size: 16
    batch_seq_len: 64
    learning_rate: 1.0e-4
    gamma: 0.997
    lambda_: 0.95
    entropy_scale: 3.0e-4
  action_space:
    steering_min: -45.0
    steering_max: 45.0
    max_steering_rate: 300.0  # degrees/second
    throttle_min: 0.0
    throttle_max: 1.0
    brake_min: 0.0
    brake_max: 1.0
  reward:
    w_safety: 2.0
    w_progress: 1.0
    w_comfort: 0.5
    w_traffic: 0.8
    w_efficiency: 0.3

# Reasoning (Alpamayo)
reasoning:
  enabled: true
  model: alpamayo-1-8b-vla  # 'alpamayo-1-8b-vla' or 'alpamayo-2-70b-super'
  device: cuda:1  # separate GPU if available
  precision: fp8
  max_latency_ms: 100.0
  trigger:
    jepa_hazard_threshold: 0.50
    rl_entropy_threshold: 2.0
    ood_score_threshold: 0.75
  hint_decay_seconds: 2.0

# Navigation (Autoware)
navigation:
  autoware:
    enabled: true
    ros2_domain_id: 42
    map_path: data/maps/default.osm
    vehicle_info:
      wheel_base: 2.75  # metres
      front_overhang: 1.0
      rear_overhang: 1.0
      vehicle_width: 1.83
      vehicle_height: 1.5
  localization:
    method: ndt  # 'ndt' or 'slam'
    ndt_resolution: 2.0
  planning:
    max_speed_kmh: 80.0
    min_speed_kmh: 0.0
    lane_change_enabled: true

# Vehicle Interface
vehicle_interface:
  type: can  # 'can', 'jaus', 'j1939'
  can:
    channel: can0
    bitrate: 500000
    timeout_ms: 500
    watchdog_timeout_ms: 500
  command_rate_hz: 20

# Safety
safety:
  asil_level: B  # 'B' for robotaxi, 'D' for military/truck
  watchdog_heartbeat_ms: 100
  watchdog_miss_limit: 3
  aeb:
    enabled: true
    ttc_threshold_s: 1.5
    deceleration_ms2: -8.0
  black_box:
    buffer_seconds: 60
    storage_path: data/logs/black_box
    encrypted: false

# Logging
logging:
  level: INFO
  log_dir: data/logs
  json_format: false
  log_latencies: true

# Training
training:
  seed: 42
  num_workers: 8
  pin_memory: true
  checkpoint_dir: data/checkpoints
  wandb:
    enabled: true
    project: omnidrive
    entity: null
