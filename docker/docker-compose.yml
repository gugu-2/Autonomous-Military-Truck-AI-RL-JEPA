version: '3.8'

services:
  omnidrive-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile.inference
    image: omnidrive-inference:latest
    container_name: omnidrive-inference
    privileged: true # Required for raw CAN access
    network_mode: "host" # ROS 2 relies on DDS, host network simplifies discovery
    pid: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    volumes:
      - ../data:/workspace/omnidrive/data:ro
      - ../configs:/workspace/omnidrive/configs:ro
      - ../logs/inference:/workspace/omnidrive/logs:rw
      - /dev:/dev # Pass-through for devices, CAN, etc.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import torch; assert torch.cuda.is_available()"]
      interval: 30s
      timeout: 10s
      retries: 3

  omnidrive-autoware:
    image: ghcr.io/autowarefoundation/autoware-universe:latest-cuda
    container_name: omnidrive-autoware
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../configs/autoware:/autoware_configs:ro
      - ../logs/autoware:/var/log/ros:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  omnidrive-monitoring:
    image: prom/prometheus:latest
    container_name: omnidrive-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  omnidrive-grafana:
    image: grafana/grafana:latest
    container_name: omnidrive-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - omnidrive-monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
