name: CI Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          pip install ruff black

      - name: Run Ruff
        run: ruff check src/ tests/

      - name: Run Black
        run: black --check src/ tests/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[test]
          pip install pytest-cov

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ --cov=src --cov-report=xml --junitxml=junit/test-results-unit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "junit/test-results-unit.xml"

  integration-tests:
    name: Integration Tests
    # We require a GPU runner for deep learning integration tests
    runs-on: ubuntu-latest
    # Assume custom runner with GPU tag if needed, otherwise this is a placeholder
    # runs-on: [self-hosted, linux, x64, gpu]
    needs: [lint, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[test]
          pip install pytest torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124

      - name: Run Integration Tests
        run: |
          export PYTHONPATH=$(pwd)/src:$PYTHONPATH
          pytest tests/integration/ --junitxml=junit/test-results-integration.xml

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "junit/test-results-integration.xml"
